aid: mileiq
name: MileIQ
description: >-
  MileIQ is an automatic mileage-tracking service for individuals and teams that logs every
  drive in the background, classifies each trip as business or personal, and calculates the
  deductible mileage value for tax and expense reporting. Its read-only OAuth 2.1 External API
  (external-api.mileiq.com) exposes authenticated user profiles, drive/trip records with start
  and end geolocation, distance, and monetary value, plus administrator access to group (team)
  rosters and member-reported drives — letting accounting, expense, and reimbursement platforms
  sync MileIQ mileage data. Originally built by Mobile Data Labs and later part of Microsoft,
  MileIQ now operates as an independent product. The API is currently available on a request basis.
